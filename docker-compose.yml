services:
  db:
    image: postgres:16
    container_name: cargo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cargo_transportation
      POSTGRES_USER: cargo_user
      POSTGRES_PASSWORD: cargo_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - cargo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_user -d cargo_transportation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cargo_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  cargo_pgdata: